<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Reporte de Bugs</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 24px;
            font-size: 13px;
        }

        th {
            background: #4f46e5;
            color: white;
            padding: 10px;
            text-align: left;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #eee;
            color: #444;
        }

        tr:hover td {
            background: #f5f5ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .card {
            background: white;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 520px;
        }

        .alerta-sucesso {
            background: #d1fae5;
            color: #065f46;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 24px;
            color: #1a1a2e;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
        }

        textarea {
            min-height: 100px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }

        .alerta-erro {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .card-tabela {
            background: white;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 900px;
            margin-top: 24px;
        }

        button:hover {
            background: #4338ca;
        }
    </style>

</head>

<body>
    <div class="card">
        {% if sucesso %}
        <div class="alerta-sucesso">
            ✅ Bug reportado com sucesso!
        </div>
        {% endif %}
        {% if erro %}
        <div class="alerta-erro">
            ⚠️ {{ erro }}
        </div>
        {% endif %}
        <h1>🐛 Reporte de Bug</h1>
        <form method="POST" enctype="multipart/form-data">
            <label>Título</label>
            <input type="text" name="titulo" placeholder="Ex: Botão de login não funciona" required>
            <label>categoria</label>
            <select name="categoria" required>
                <option value="">Selecione...</option>
                <option value="Visual">Visual</option>
                <option value="Funcionalidade">Funcionalidade</option>
                <option value="Performace">Performace</option>
                <option value="Segurança">Segurança</option>
                <option value="Outro">Outro</option>
            </select>
            <label>Descrição</label>
            <textarea name="descricao" placeholder="Decreva o problema com mais detalhes..."></textarea>
            <label>Data do problema</label>
            <input type="date" name="data_problema" required>
            <label>Print da tela (opicional)</label>
            <input type="file" name="imagem" accept="image/*">
            <button type="submit">Enviar Reporte</button>
        </form>
    </div>

    <div class="card-tabela">
        <h2>📋 Bugs Reportados</h2>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Título</th>
                    <th>Categorias</th>
                    <th>Status</th>
                    <th>Data</th>
                </tr>
            </thead>
            <tbody>
                {% for bug in bugs %}
                <tr>
                    <td>{{ bug[0] }}</td>
                    <td>{{ bug[1] }}</td>
                    <td>{{ bug[2] }}</td>
                    <td>{{ bug[3] }}</td>
                    <td>{{ bug[4] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <script>
        const alerta = document.querySelector('.alerta-sucesso');
        if (alerta) {
            setTimeout(function () {
                alerta.style.transition = 'opacity 0.5s';
                alerta.style.opacity = '0';
                setTimeout(function () {
                    alerta.style.display = 'none';
                }, 500);
            }, 3600);
        }
    </script>

</body>

</html>
