<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title> Reporte de Bugs</title>
        <style>
            * { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: Arial, sans-serif;
    background: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
        }

.card {
    background: white;
    padding: 32px;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    width: 100%;
    max-width: 520px;
}
.alerta-sucesso {
    background: #d1fae5;
    color: #065f46;
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 20px;
    font-weight: bold;
}

h1 { font-size: 22px; margin-bottom: 24px; color: #1a1a2e; }

label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; }

input, select, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 16px;
}

textarea { min-height: 100px; }

button {
    width: 100%;
    padding: 12px;
    background: #4f46e5;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
}

button:hover { background: #4338ca; }
        </style>
    </head>
    <body>
        <div class="card">
            {% if sucesso %}
            <div class="alerta-sucesso">
            ✅ Bug reportado com sucesso!
             </div>
            {% endif %}
            <h1>🐛 Reporte de Bug</h1>
            <form method="POST" enctype="multipart/form-data">
                <label>Título</label>
                <input type="text" name="titulo" placeholder="Ex: Botão de login não funciona" required>
                <label>categoria</label>
                <select name="categoria" required>
                    <option value="">Selecione...</option>
                    <option value="Visual">Visual</option>
                    <option value="Funcionalidade">Funcionalidade</option>
                    <option value="Performace">Performace</option>
                    <option value="Segurança">Segurança</option>
                    <option value="Outro">Outro</option>
                    </select>
                    <label>Descrição</label>
                    <textarea name="descricao" placeholder="Decreva o problema com mais detalhes..."></textarea>
                    <label>Data do problema</label>
                    <input type="date" name="data_problema" required>
                    <label>Print da tela (opicional)</label>
                        <input type="file" name="imagem" accept="image/*">
                        <button type="submit">Enviar Reporte</button>
                    

            </form>
        </div>
        <script>
        const alerta = document.querySelector('.alerta-sucesso');
        if (alerta) {
        setTimeout(function() {
            alerta.style.transition = 'opacity 0.5s';
            alerta.style.opacity = '0';
            setTimeout(function() {
                alerta.style.display = 'none';
            }, 500);
        }, 3600);
    }
</script>
        
    </body>
</html>>
