<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 24px;
            font-size: 13px;
        }

        th {
            background: #4f46e5;
            color: white;
            padding: 10px;
            text-align: left;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #eee;
            color: #444;
        }
    </style>
</head>

<body>
    <h1>⚙️ Painel Administrativo</h1>
    <a href="/">Voltar</a>
    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Título</th>
                <th>Categoria</th>
                <th>Status</th>
                <th>Data</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for bug in bugs %}
            <tr>
                <td>{{ bug[0] }}</td>
                <td>{{ bug[1] }}</td>
                <td>{{ bug[2] }}</td>
                <td>{{ bug[3] }}</td>
                <td>{{ bug[4] }}</td>
                <td>
                    <a href="/atualizar-status/{{ bug[0] }}/Aberto">🔴 Aberto</a>
                    <a href="/atualizar-status/{{ bug[0] }}/Em andamento">🟡 Em andamento</a>
                    <a href="/atualizar-status/{{ bug[0] }}/Resolvido">🟢 Resolvido</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>

</html>
